# WKDR Marketplace Service 配置文件

# 服务器配置
server:
  port: 9090              # 服务端口
  read_timeout: 30s       # 读取超时时间
  write_timeout: 30s      # 写入超时时间
  idle_timeout: 60s       # 空闲超时时间

# 数据库配置
db:
  driver: mysql           # 数据库驱动
  host: localhost         # 数据库主机
  port: 3306             # 数据库端口
  username: root         # 用户名
  password: "123456"     # 密码
  database: wkdr_marketplace  # 数据库名
  max_idle_conns: 10     # 最大空闲连接数
  max_open_conns: 100    # 最大打开连接数
  conn_max_lifetime: 3600s  # 连接最大生存时间

# Redis配置
redis:
  host: localhost        # Redis主机
  port: 6379            # Redis端口
  password: ""          # Redis密码（默认为空）
  db: 0                 # Redis数据库索引
  pool_size: 10         # 连接池大小
  idle_timeout: 240s    # 空闲连接超时时间
